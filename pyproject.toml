[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Privacy-first retail theft-gesture detection: edge pipeline + cloud backend (Phase 1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy ML backends are optional: the pipeline runs against synthetic/pluggable
# backends by default (see docs/architecture/detection-pipeline.md).
ml = [
    "ultralytics>=8.2",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]
train = [
    "torch>=2.2",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
]
mqtt = ["paho-mqtt>=2.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
